<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love Abhiramy ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: linear-gradient(-45deg, #ff4e7a, #ff9a9e, #fad0c4, #ffdde1);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    padding: 20px;
    overflow-x: hidden;
}

@keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.container {
    max-width: 800px;
    width: 100%;
    transition: opacity 1s ease;
}

h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    line-height: 1.2;
    text-shadow: 0 0 15px rgba(255,255,255,0.8);
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #fff, 0 0 20px #ff4e7a; }
    to { text-shadow: 0 0 20px #fff, 0 0 40px #ff007f; }
}

p {
    font-size: clamp(1rem, 3vw, 1.4rem);
    margin-top: 20px;
    line-height: 1.6;
}

button {
    margin-top: 35px;
    padding: 14px 35px;
    border-radius: 50px;
    border: none;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    background: white;
    color: #ff4e7a;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff4e7a;
    color: white;
    transform: scale(1.05);
}

button:active {
    transform: scale(0.95);
}

/* Floating hearts */
.heart {
    position: absolute;
    font-size: 20px;
    animation: floatUp linear infinite;
    pointer-events: none;
}

@keyframes floatUp {
    0% {
        bottom: -20px;
        opacity: 1;
        transform: translateX(0);
    }
    100% {
        bottom: 110%;
        opacity: 0;
        transform: translateX(80px);
    }
}

/* Final Message */
.finalMessage {
    position: absolute;
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2rem, 7vw, 5rem);
    text-align: center;
    animation: finalReveal 2s forwards;
}

@keyframes finalReveal {
    0% {opacity: 0; transform: scale(0.5);}
    100% {opacity: 1; transform: scale(1);}
}

</style>
</head>

<body>

<div class="container" id="mainContent">
    <h1>Happy Valentine's Day ❤️</h1>

    <p>
        Abhiramy… 💖<br><br>
        You are my happiness,<br>
        my peace,<br>
        my forever.<br><br>
        I love you endlessly.<br>
        – Paul
    </p>

    <button onclick="revealLove()">Click / Tap Here 💌</button>
</div>

<div id="finalContainer"></div>

<script>

let revealed = false;

function revealLove() {
    if (revealed) return;
    revealed = true;

    const main = document.getElementById("mainContent");
    const final = document.getElementById("finalContainer");

    main.style.opacity = "0";

    setTimeout(() => {
        main.style.display = "none";
        final.innerHTML = `
            <div class="finalMessage">
                Abhiramy ❤️<br>
                You Are My Forever 💍✨
            </div>
        `;
    }, 800);
}

// Floating hearts generator
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 25 + 15) + "px";
    heart.style.animationDuration = (Math.random() * 4 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 400);

</script>

</body>
</html>
